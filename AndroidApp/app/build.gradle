plugins {
    id 'com.android.application'
}

android {
    namespace 'com.freelander.control'
    compileSdk 34

    defaultConfig {
        applicationId 'com.freelander.control'
        minSdk 17
        targetSdk 28
        versionCode 1
        versionName '0.1-prototype'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
